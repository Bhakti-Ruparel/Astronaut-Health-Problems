services:
  - type: web
    name: astromind
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: ASTROMIND_INTERNAL_TOKEN
        generateValue: true
